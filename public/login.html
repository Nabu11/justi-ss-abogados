<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso — S&S Abogados</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .login-box {
      width: 400px;
      max-width: 90vw;
      padding: 36px;
    }
    .login-brand {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-brand .icon {
      font-size: 40px;
      margin-bottom: 8px;
    }
    .login-brand h2 {
      font-family: var(--font-heading);
      color: var(--accent-gold);
      font-size: 22px;
    }
    .login-brand p {
      font-size: 13px;
      color: var(--text-muted);
    }
    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-box glass-card">
    <div class="login-brand">
      <div class="icon">🏛️</div>
      <h2>S&S Abogados</h2>
      <p>Panel de Administración & Secretaria Justi</p>
    </div>

    <div class="alert-error" id="login-error">Credenciales incorrectas. Verificá tu usuario y contraseña.</div>

    <form id="form-login">
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" id="login-user" class="form-control" required placeholder="admin" value="admin">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="login-pass" class="form-control" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-gold" style="width:100%; margin-top:12px;">Ingresar al Panel 🔐</button>
    </form>
  </div>

  <script>
    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = document.getElementById('login-user').value;
      const pass = document.getElementById('login-pass').value;
      const errBox = document.getElementById('login-error');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user, pass })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('justi_auth_token', data.token);
          window.location.href = '/';
        } else {
          errBox.style.display = 'block';
        }
      } catch (err) {
        errBox.innerText = 'Error conectando con el servidor.';
        errBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
